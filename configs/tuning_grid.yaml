# Hyperparameter search space — 3×3×4×3 = 108 configs
search_space:
  fanouts:
    - [15, 10]
    - [25, 15]
    - [35, 25]
  hidden_size: [64, 128, 256]
  dropout: [0.1, 0.2, 0.3, 0.4]
  batch_size: [512, 1024, 2048]

# Held constant across the grid.
# NOTE (verified 2026-07-29, specs/32 §1.4): the first five keys below are
# UNCONDITIONALLY OVERWRITTEN at scripts/03_tune.py by the experiment config's
# model: block, so editing them here has no effect. balancing_strategy has zero
# consumers (the balancer reads cfg["balancer"]["strategy"]). Making this block
# live would change the 108 trials themselves and is deliberately out of scope.
fixed:
  num_layers: 2
  aggregator: "mean"
  learning_rate: 0.001
  temporal_window_seconds: 60
  balancing_strategy: "oversample"
  node_state_dim: 15

# Per-trial training budget. READ BY scripts/03_tune.py via
# src.model.tuner.resolve_trial_settings(); overrides model.max_epochs /
# model.patience from the experiment config for the duration of the grid
# search (src/model/tuner.py, cfg_trial["model"]["max_epochs"|"patience"]).
# Missing keys are a hard error — never silently defaulted (specs/32 §2.2).
#
# Budget rationale (specs/33 §II.1-II.2): trials are ranked by
# model.early_stopping_metric, which is "composite" for UNSW. Per
# configs/experiment_unsw.yaml:30, the minority class driving composite first
# appears ~epoch 13 and composite keeps improving 17+ epochs after that
# (≈ epoch 30). max_epochs 40 clears that with 10 epochs of margin; patience 20
# survives a 17-epoch non-improving stretch, so a trial is not killed
# mid-recovery. Worst case 108 × 40 = 4,320 epochs; see §II.2.3 for the
# 168 h HPC-queue-cap arithmetic.
trial:
  max_epochs: 40
  patience: 20

# Trial-selection noise band + tie-break priority (specs/37, specs/38).
# READ BY scripts/03_tune.py via src.model.tuner.resolve_selection_settings();
# a missing 'selection:' block or missing sub-key is a hard error -- never
# silently defaulted (same discipline as the trial: block above).
#
# tie_band_pp: candidates scoring within this many percentage points of the
# argmax (of best_val_macro_f1 / the composite metric, whichever
# early_stopping_metric selects) are statistically indistinguishable at
# this pipeline's measured run-to-run noise (specs/36 S4.2-S4.3: sigma ~=
# 1.5-2.3pp, vs a top-1/top-2 gap of 0.042-0.075pp) and are treated as tied.
#
# tie_break_axes: ordered, highest-priority axis first. "cheapest" names
# which END of this axis's OWN search_space list (above) is the preferred
# value -- NOT a numeric ascending/descending rule. Axis names are
# validated against the live search_space; an unknown axis, or a cheapest
# value other than "first"/"last", is a hard error (specs/37 S3.2).
#
# tie_band_pp: 2.0 CONFIRMED by the project owner (2026-08-01, specs/37 S5
# Q2) -- sits inside the measured sigma range (1.5-2.3pp), deliberately
# leaning toward the inclusive end since sigma is likely a floor at
# production scale (largest directly measured: 1.5M edges/12 epochs, vs
# real UNSW trials at 2.6M edges/40 epochs -- specs/36 S7.1).
#
# tie_break_axes: fanouts-first / hidden_size-first (specs/36 S6.2's
# literal wording) CONFIRMED by the project owner (2026-08-01, specs/37 S5
# Q1) -- batch_size deliberately excluded from tie-breaking, not merely
# deprioritized. batch_size is by far the dominant measured cost axis
# (specs/34 S1.2: 2.55-2.64x spread, vs fanouts 1.20x and hidden_size
# ~1.07x), but learning_rate is fixed across this grid, so batch_size is
# coupled to optimizer-step count per epoch -- an unmeasured
# training-dynamics confound on this dataset's small minority class that
# the owner weighted above the (largely theoretical, given weak A100
# utilization across this whole batch_size range -- fixed at grid sizes
# comparable to TE-G-SAGE, not GPU-saturation-driven) cost savings.
# Verified moot in practice on job 1007104's actual 8-trial tie set at
# tie_band_pp=2.0: batch_size-first and fanouts-first orderings pick the
# IDENTICAL winner there (trial 1) -- this choice has zero effect on the
# one real run it was checked against, so there was nothing to trade away
# by choosing the quality-safer ordering.
selection:
  tie_band_pp: 2.0
  tie_break_axes:
    - {axis: fanouts, cheapest: first}
    - {axis: hidden_size, cheapest: first}
