data:
  csv_path: "data/NF-UNSW-NB15-v3.csv"
  train_frac: 0.6
  val_frac: 0.3
  # test_frac is implied: 1 - train_frac - val_frac = 0.1

preprocessing:
  spearman_threshold: 0.995
  ohe_min_frequency: 0.001   # fraction of training data; rare categories → "infrequent" bin
  ohe_handle_unknown: "ignore"

balancer:
  strategy: "oversample"      # oversample | undersample | hybrid
  min_class_ratio: 0.1        # each minority class reaches 10% of majority count
  max_majority_ratio: 5.0     # for undersample: benign ≤ 5× total attack count
  seed: 42
  class_weight_method: "effective_num"   # "inverse_freq" | "sqrt_inverse_freq" | "effective_num"
  effective_num_beta: 0.9999             # Cui et al. 2019 — tunable per dataset
  class_weight_max_clamp: null           # null = no clamp; set float as last-resort safety net
  log_class_weights: true                # always log final weights — required for paper reporting

output:
  outputs_dir: "outputs"
  feature_store_dir: "feature_store"
  artifacts_dir: "artifacts"
  transformers_dir: "artifacts/transformers"
  split_indices_path: "artifacts/split_indices.json"
  feature_groups_path: "artifacts/feature_groups.json"
  balanced_train_indices_path: "artifacts/balanced_train_indices.npy"
  class_weights_path: "artifacts/class_weights.npy"

run:
  dir: ""   # when set (e.g. "runs/dataset02"), prefixed onto all output/graph paths

seed: 42

model:
  num_layers: 2
  hidden_size: 128
  dropout: 0.4
  aggregator: "mean"
  fanouts: [25, 15]
  node_state_dim: 15
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 50
  patience: 10
  # num_classes is derived dynamically from artifacts/label_map.json —
  # do NOT set it here. Scripts 03_tune.py, 04_train.py, 13_ablations.py
  # load it from the label map after 01_preprocess.py has run.
  early_stopping_metric: "macro_f1"      # "macro_f1" | "minority_macro_f1" | "composite"
  minority_class_threshold: 5000         # n_train < this → minority class
  composite_minority_weight: 0.5         # α: weight of minority_macro_f1 in composite
  temporal_window_seconds: 60
  # Periodic node-state snapshot cache built by NodeStateManager.build_snapshots
  # Pass 2. Disabled by default (0). Nothing on the runtime query path
  # (get_state_at_time/get_batch_states/rollback_edge(s)) reads it — every
  # real query recomputes from per-node edge histories directly. At Paper-3
  # scale (19-25M edges) this Pass 2 was an O(n_snapshots x n_nodes) memory
  # sink that OOM'd on HPC for zero runtime benefit. Its only consumer is the
  # optional exploration figure script explore/graph/topology_panel.py, which
  # degrades gracefully (no node-state overlay) with this disabled. Set to a
  # positive int (e.g. 1000) in an experiment config to re-enable per run.
  snapshot_interval: 0

graph:
  dir: "graphs"
  node_state_dir: "node_state_snapshots"

topology:
  # Malicious-subgraph gateway-distance diagnostic (spec 05, implementation
  # spec for phase 14). Stage-0 only — read-only measurement, never feeds
  # model.num_layers/fanouts automatically (that would be Stage 2, manual).
  gateway_distance:
    enabled: true              # phase 14 runs by default; false -> phase self-skips (exit 0)
    internal_prefixes: "auto"  # "auto" | list of CIDR strings, e.g. ["10.0.0.0/8"]
                                # auto: RFC1918/loopback via graph_builder + local loopback
                                # check; falls back to malicious-flow-destination inference
                                # when zero internal nodes receive malicious flows (UNSW case)
    drift_check: true          # emit train-first-half vs second-half k*/d_gw drift
    k_max: 4                   # cap on reported k* (tuning-grid upper bound)
    diameter_max_component_nodes: 2000   # exact (usebounds) at/below; double-sweep lower bound above
    diameter_max_component_edges: 5000   # exact (usebounds) at/below; double-sweep lower bound above

compute:
  device: "cuda"
  num_workers: 0
  pin_memory: true
  # Opt-in perf flag, default off: replace DataLoader(TensorDataset(eids))
  # with contiguous-slice index batching. Verified bit-identical batch
  # contents/order/drop_last semantics vs the DataLoader path — no behavior
  # change unless explicitly enabled.
  fast_index_loader: false
  # Opt-in perf flag, default off: compute build_src_dst_pos from the CPU
  # block's node IDs before blocks.to(device), instead of after. Same
  # integer node IDs either way — no behavior change unless explicitly
  # enabled.
  cpu_src_dst_pos: false

reproducibility:
  model_seed: 42
  coalition_seed: 123
  background_seed: 456
