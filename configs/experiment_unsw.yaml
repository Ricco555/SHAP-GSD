# NF-UNSW-NB15-v3 experiment — overrides default.yaml
data:
  csv_path: "data/NF-UNSW-NB15-v3.csv"
  train_frac: 0.644821
  val_frac: 0.174783

run:
  dir: "runs/nf_unsw_nb15_v3"

preprocessing:
  spearman_threshold: 0.995
  ohe_min_frequency: 0.001
  ohe_handle_unknown: "ignore"

balancer:
  strategy: "oversample"
  min_class_ratio: 0.0
  max_majority_ratio: 5.0
  seed: 42
  class_weight_method: "effective_num"    # armRb: loss reweighting only, no oversample-side compensation
  effective_num_beta: 0.9999
  class_weight_max_clamp: null            # armRb: unclamped

reproducibility:
  model_seed: 90

model:
  early_stopping_metric: "composite"
  minority_class_threshold: 5000         # S2 train split: selects DoS(2358) Analysis(646) Backdoor(3219) Shellcode(1160) Worms(64) — not Reconnaissance(6874)
  composite_minority_weight: 0.5
  patience: 20

seed: 42
